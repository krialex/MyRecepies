        <div class="comment-section">
            <h3 class="feed-h3">Legg igjen en kommentar</h3>
            <form class="comment-form">
                <div class="form-group row">
                  <label for="author_name" class="col-9">Brukernavn</label>
                  <input type="text" class="form-control col-9" id="author_name" required>
                  <div class="error-message" id="error-name">Brukernavn må være mer enn 2 bokstaver.</div>
                </div>
                <div class="form-group row">
                    <label for="author_email" class="col-9">Email</label>
                    <input type="email" class="form-control col-9" id="author_email" placeholder="Din email vil ikke bli vist på kommentaren.." required>
                    <div class="error-message" id="error-email">Vær snill å skriv inn korrekt mailadresse.</div>
                  </div>
                <div class="form-group row">
                  <label for="comment_content" class="col-9">Melding</label>
                  <textarea class="form-control col-9" id="comment_content" rows="3" required></textarea>
                  <div class="error-message" id="error-content">Du skal vel skrive noe?</div>
                </div>
                <button class="btn cta messageBtn" id="send-comment">Send</button>
                <hr>
                <div class="form-group comments-container"></div>

              </form>
        </div>
